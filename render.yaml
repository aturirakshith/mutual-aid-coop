services:
  - type: web
    name: macs-app
    runtime: node
    region: singapore   # change to: oregon, ohio, frankfurt, or singapore
    rootDir: app
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/auth/session
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: macs-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true        # Render auto-generates a secure random string
      - key: NEXTAUTH_URL
        sync: false                # Set manually in dashboard to your .onrender.com URL

databases:
  - name: macs-db
    databaseName: macs_db
    region: singapore   # must match the web service region
    plan: free          # upgrade to starter ($7/mo) for daily backups
